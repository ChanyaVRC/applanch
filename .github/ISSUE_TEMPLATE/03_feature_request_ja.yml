name: 機能要望 (日本語)
description: 新機能や UX 改善の提案を投稿します。
title: "[要望]: "
labels:
  - enhancement
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな課題を解決したいかを書いてください。
      placeholder: ... したい。なぜなら ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 具体的なアイデアを記載してください。
      placeholder: ... の設定/ボタン/ワークフローを追加する
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別案や暫定回避策があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 影響範囲
      description: 利用者への効果や懸念点があれば記載してください。
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: applanch バージョン
      description: 特定バージョンに関係する場合のみ入力してください。
      placeholder: v0.0.0
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存の Issue を確認し、重複がないことを確認しました。
          required: true